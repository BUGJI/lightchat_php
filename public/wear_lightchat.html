<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="./favicon.ico" type="image/x-icon" sizes="any">
<meta name="theme-color" content="#000000">
<title>LightChat Watch</title>
<style>
/* ════════════════════════════════════════════
   LightChat Watch v2 — Apple Watch 风格深色主题
   布局结构与 v1 一致，仅视觉重绘
   ════════════════════════════════════════════ */
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --sep:rgba(84,84,88,.45);
  --txt:#fff; --txt2:#98989f; --txt3:#636366;
  --accent:#0a84ff; --accent-dim:#0a84ff33;
  --red:#ff453a; --green:#30d158; --orange:#ff9f0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,system-ui,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:17px;line-height:1.4;color:var(--txt);
  overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch;
  -webkit-text-size-adjust:100%;
}
input,textarea,button,select{font-family:inherit;font-size:17px;color:var(--txt)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
input,textarea,select{
  background-color:var(--card);border:1px solid var(--sep);border-radius:12px;
  padding:12px 14px;width:100%;-webkit-appearance:none;appearance:none;outline:none;min-height:46px;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{
  background:var(--card2);border:none;border-radius:14px;min-height:46px;
  font-weight:600;cursor:pointer;transition:opacity .15s,transform .05s;width:100%;
}
button:active{opacity:.6;transform:scale(.985)}
button:disabled{opacity:.4}
.page{display:none;padding-bottom:24px;animation:pageIn .18s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.box-list{display:flex;flex-direction:column;border:none}
.section-title{
  display:flex;align-items:center;gap:8px;padding:14px 6px 4px;
  color:var(--txt2);font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  cursor:pointer;user-select:none;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--sep);opacity:.5}
.section-title .arrow{font-size:10px;color:var(--txt3);transition:transform .2s;transform:rotate(0)}
.section-title.collapsed .arrow{transform:rotate(-90deg)}
.section-body.collapsed{display:none}
.userlist{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:var(--card);border-radius:16px;min-height:60px;cursor:pointer;
  transition:transform .05s,opacity .15s;position:relative;
  margin:1px 0;
}
.userlist:active{opacity:.6;transform:scale(.985)}
.head{
  width:44px;height:44px;border-radius:22px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;color:#fff;overflow:hidden;
}
.head.avatar{background:var(--accent)}
.user-pre{flex:1;min-width:0}
.name{font-size:17px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.message-pre{font-size:14px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read-pre{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.read-pre.unread{color:#fff;background:var(--red)}
.read-pre.read{color:var(--txt3);font-size:15px}
.badge-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:4px}
#topBar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:4px;padding:6px 8px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--sep);min-height:50px;
}
#topBar a{
  font-size:22px;font-weight:600;color:var(--accent);text-decoration:none;
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  padding:0 10px;margin-left:-10px;border-radius:12px;
}
#topBar a:active{background:rgba(255,255,255,.08)}
#topBar div{flex:1;text-align:center;font-size:18px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#joinBtn{width:auto;min-width:72px;min-height:36px;font-size:14px;padding:6px 14px;border-radius:18px;background:var(--accent);color:#fff;margin-right:4px}
#mgBtn{width:44px;min-width:44px;height:44px;min-height:44px;font-size:20px;padding:0;border-radius:50%;background:transparent;color:var(--accent);border:none;margin-right:4px}
#mgBtn:active{background:rgba(255,255,255,.08)}
#box{overflow-y:auto;padding:14px 10px 64px}
.message-group{display:flex;flex-direction:column;margin-bottom:3px}
.message-sender-name{font-size:13px;color:var(--txt2);margin:6px 18px 1px}
.message-text{
  max-width:84%;width:fit-content;padding:10px 14px;margin:3px 0;
  background:var(--card);color:var(--txt);border-radius:18px 18px 18px 4px;
  font-size:17px;line-height:1.35;word-break:break-word;
}
.message-text.selfmessage{margin-left:auto;background:var(--accent);color:#fff;border-radius:18px 18px 4px 18px}
.message-text.img{padding:3px;background:transparent;max-width:200px}
.message-text.img img{max-height:200px;width:auto;border-radius:12px;cursor:pointer;object-fit:cover;display:block;background:var(--card)}
.system-message-text{text-align:center;color:var(--txt3);font-size:12.5px;margin:14px auto;padding:5px 14px;max-width:82%;background:rgba(255,255,255,.06);border-radius:14px}
.reply-preview{font-size:13px;color:var(--txt2);background:rgba(255,255,255,.05);padding:5px 8px;margin:4px 0;border-left:2.5px solid var(--accent);border-radius:6px;width:max-content}
.reply-preview.selfmessage{margin-left:auto}
.time-sep{text-align:center;color:var(--txt3);font-size:12px;margin:14px auto 4px}
#inputBar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(10,10,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--sep);
}
#inputBar input{flex:1;margin:0;border-radius:21px;padding:10px 16px;font-size:17px;background:var(--card);border:none}
#sendBtn{width:44px;min-width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
#sendBtn:disabled{background:var(--card2);color:var(--txt3)}
#imgViewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;cursor:pointer}
#imgViewerImg{max-width:92%;max-height:92%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:16px}
/* 管理底部抽屉 */
#manageSheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:800;display:none;align-items:flex-end;justify-content:center}
#manageSheet.open{display:flex}
#managePanel{width:100%;max-width:430px;max-height:88%;overflow-y:auto;background:rgba(24,24,27,.98);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));box-sizing:border-box}
#managePanel h3{margin:2px 0 4px;font-size:19px;color:var(--txt)}
#managePanel .mg-meta{font-size:13px;color:var(--txt2);margin-bottom:12px}
#managePanel label{display:block;font-size:13px;color:var(--txt2);margin:12px 2px 4px}
#managePanel input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--txt);border:1px solid var(--sep);font-size:16px;margin:0}
#managePanel input[type=text]:disabled{opacity:.5;background:var(--card2)}
#managePanel .lock-tip{font-size:12px;color:var(--txt3);margin-top:5px}
#managePanel select{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:12px;background:var(--card);color:var(--txt);border:1px solid var(--sep);font-size:15px}
#managePanel .rowline{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--sep);font-size:15px;color:var(--txt)}
#managePanel .rowline .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-btn{display:block;width:100%;margin-top:14px;padding:12px;border-radius:14px;border:none;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
.mg-btn.danger{background:rgba(255,69,58,.16);color:#ff453a}
.mg-btn.ghost{background:var(--card);color:var(--txt)}
.switch{position:relative;width:48px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--card2);border-radius:30px;transition:.2s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:before{transform:translateX(18px)}
#toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  background:rgba(40,40,44,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;
  max-width:86%;text-align:center;z-index:9998;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:rgba(255,69,58,.92)}
.small{font-size:14px;font-weight:500}
.settings-footer{color:var(--txt3);text-align:center;padding:16px 0;font-size:12px}
.login-head{padding:28px 12px 18px;text-align:center}
.login-head .logo{width:64px;height:64px;border-radius:50%;background:var(--accent);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;box-shadow:0 0 24px var(--accent-dim)}
.login-head .sub{color:var(--txt2);font-size:14px}
.link{color:var(--accent);text-decoration:none}
.seg-label{display:flex;align-items:center;gap:6px;padding:10px 2px 4px;font-size:13px;color:var(--txt2)}
@media screen and (max-width:280px){
  .head{width:38px;height:38px;border-radius:19px;font-size:17px}
  .message-text{font-size:16px}
  .message-text.img img{max-height:120px}
  .name{font-size:16px}.message-pre{font-size:13px}
  .userlist{padding:8px 10px}
}
/* v2 补充规则 */
.read-pre.read.join{color:var(--accent);font-size:15px;font-weight:700}
.message-text{white-space:pre-wrap}
.message-text a{color:var(--accent);font-size:13px;text-decoration:none}
.msg-img{max-height:170px;width:auto;border-radius:14px;cursor:pointer;object-fit:cover;display:block;background:var(--card);margin-top:2px}
#imgViewer img{max-width:92%;max-height:92%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:16px}
input[type=checkbox]{width:20px;height:20px;min-height:20px;border-radius:6px;background:var(--card);border:1.5px solid var(--sep);accent-color:var(--accent);-webkit-appearance:none;appearance:none}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
select{background-image:none;padding-right:10px}
</style>
</head>
<body>

<div id="scaleRoot">
  <!-- ═══ 登录页 ═══ -->
  <div id="login" class="page active">
    <div class="box-list">
      <div style="padding:20px 12px;text-align:center;color:#888;font-size:14px">LightChat 登录</div>
      <input id="loginUser" placeholder="邮箱 / 用户名" value="">
      <input id="loginPass" type="password" placeholder="密码" value="" style="margin-top:8px">
      <div style="display:flex;align-items:center;gap:6px;padding:8px 0;font-size:13px;color:var(--txt2)">
        <input type="checkbox" id="loginAgree" style="width:auto;min-width:auto;margin:0">
        <span>同意 <a href="terms/privacy.html" target="_blank" style="color:var(--accent)">隐私政策</a></span>
      </div>
      <button onclick="doLogin()" style="margin-top:4px">登录</button>
      <button onclick="showPage('register')" class="small" style="margin-top:4px;background:transparent">注册新账号</button>
      <div style="text-align:center;margin-top:8px">
        <button onclick="showSettings()" class="small" style="background:transparent;color:var(--txt3);width:auto;min-width:auto;font-size:13px">⚙️ API 地址</button>
      </div>
      <div id="loginError" style="text-align:center;color:#f44;font-size:13px;min-height:20px;margin-top:8px"></div>
    </div>
  </div>

  <!-- ═══ 注册页 ═══ -->
  <div id="register" class="page">
    <div class="box-list">
      <div style="padding:20px 12px;text-align:center;color:#888;font-size:14px">注册新账号</div>
      <input id="regUser" placeholder="用户名（用于展示）">
      <input id="regPass" type="password" placeholder="密码（至少6位）" style="margin-top:8px">
      <input id="regEmail" type="email" placeholder="邮箱 *" style="margin-top:8px">
      <div style="display:flex;align-items:center;gap:6px;padding:8px 0;font-size:13px;color:var(--txt2)">
        <input type="checkbox" id="regAgree" style="width:auto;min-width:auto;margin:0">
        <span>同意 <a href="terms/privacy.html" target="_blank" style="color:var(--accent)">隐私政策</a></span>
      </div>
      <button onclick="doRegister()" style="margin-top:4px">注册</button>
      <button onclick="showPage('login')" class="small" style="margin-top:4px;background:transparent">← 返回登录</button>
      <div id="regError" style="text-align:center;color:#f44;font-size:13px;min-height:20px;margin-top:8px"></div>
    </div>
  </div>

  <!-- ═══ 聊天列表 ═══ -->
  <div id="chat" class="page">
    <div class="box-list">
      <div class="userlist" onclick="showDiscover()" data-id="discover-entry">
        <div class="head" style="background:var(--accent)">＋</div>
        <div class="user-pre"><div class="name">添加好友 / 群组</div><div class="message-pre">搜索频道或用户</div></div>
      </div>
    </div>
    <div class="box-list" id="chat_list"></div>
    <div class="box-list">
      <div class="name" onclick="showPage('settings')" style="padding:12px;text-align:center;cursor:pointer">⚙️ 设置</div>
    </div>
  </div>

  <!-- ═══ 添加好友 / 群组（发现）═══ -->
  <div id="discover" class="page">
    <div class="box-list">
      <div class="userlist" onclick="goBack()" data-id="discover-back">
        <div class="user-pre"><div class="name">← 返回聊天</div></div>
      </div>
      <div style="padding:14px 12px 2px;color:var(--txt2);font-size:14px">🔍 输入关键词可搜索群组与用户，留空显示可加入的公开频道</div>
      <input id="discoverInput" placeholder="搜索频道或用户名" style="margin-top:8px" autocomplete="off">
      <div id="discoverResults" style="padding-top:4px"></div>
    </div>
  </div>

  <!-- ═══ 设置 ═══ -->
  <div id="settings" class="page">
    <div class="box-list">
      <div class="userlist" onclick="goBack()" data-id="back-to-chat">
        <div class="user-pre"><div class="name">← 返回聊天</div></div>
      </div>
      <div class="userlist" style="cursor:default">
        <div class="user-pre"><div class="name">显示缩放</div></div>
        <div><select id="scaleSel" onchange="setScale(this.value)" style="width:auto;min-width:80px">
          <option value="100">100%</option><option value="125">125%</option>
          <option value="150">150%</option><option value="175">175%</option><option value="200">200%</option>
        </select></div>
      </div>
      <div class="userlist" style="cursor:default">
        <div class="user-pre"><div class="name">轮询间隔</div></div>
        <div><select onchange="setPollInterval(this.value)" style="width:auto;min-width:80px">
          <option value="1">1秒</option><option value="2" selected>2秒</option>
          <option value="5">5秒</option><option value="10">10秒</option><option value="30">30秒</option>
        </select></div>
      </div>
      <div class="userlist" onclick="refreshChats()"><div class="user-pre"><div class="name">刷新列表</div></div></div>
      <div class="userlist" onclick="doLogout()"><div class="user-pre"><div class="name" style="color:var(--red)">退出登录</div></div></div>
    </div>
    <div class="box-list"><div class="settings-footer">LightChat Watch v1.0</div></div>
  </div>

  <!-- ═══ 聊天窗口 ═══ -->
  <div id="chatbox" class="page">
    <div id="topBar">
      <a onclick="goBack()">←</a>
      <div id="chatboxTitle">聊天</div>
      <button id="joinBtn" onclick="joinCurrentChannel()" style="display:none">加入</button>
      <button id="mgBtn" onclick="showChatManage()" style="display:none" aria-label="管理">⚙️</button>
    </div>
    <div id="box"></div>
    <div id="inputBar">
      <input id="msg" placeholder="输入消息..." value="">
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<!-- ═══ 会话管理（频道管理 / 联系人管理）═══ -->
<div id="manageSheet" onclick="if(event.target===this)closeManage()">
  <div id="managePanel"></div>
</div>

<!-- ═══ 图片查看器 ═══ -->
<div id="imgViewer" onclick="hideImg()"><img id="imgViewerImg" src="" alt=""></div>

<!-- ═══ 轻提示 ═══ -->
<div id="toast" role="status"></div>

<script>
/* ════════════════════════════════════════════
   LightChat Watch 客户端
   适配 PHP API 后端 (不依赖任何 CDN)
   ════════════════════════════════════════════ */

// ── API 配置（同源部署常量；如需部署到其他域名，改为完整地址如 'https://chat.example.com'）──
const API_BASE = '';

// ── 全局状态 ──
const S = {
  user: null,       // { id, username, role }
  token: null,      // Bearer token
  channels: [],     // [{ id, display_name, type, ... }]
  privateChats: [], // [{ id, other_user_id, other_username, ... }]
  users: [],        // all users
  activeChat: null, // { id, type:'channel'|'private', name }
  joinedIds: new Set(),
  messages: [],     // current chat messages
  pollTimer: null,
  pollInterval: 2000,
  lastPollId: 0,
  lastMsgTime: 0,
  userCache: new Map(), // uid → {username, avatar}
  pollMode: 'list',     // 'list' | 'chatbox'
  pollAbort: null,      // 当前 poll fetch 的 AbortController
  unreadSnap: {},       // 列表页未读基线 {'c<id>':n,'p<id>':n}
  lastMsgUserId: 0,     // 消息分组辅助（气泡连续归属）
};

// ── API 封装（12s 超时）──
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const url = API_BASE + '/api' + path;
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 12000);
  try {
    const res = await fetch(url, { ...opts, headers, signal: ac.signal });
    const data = await res.json();
    if (!res.ok) { const err = new Error(data.message || '请求失败'); err.status = res.status; throw err; }
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('请求超时');
    throw e;
  } finally { clearTimeout(timer); }
}

// ── 认证 ──
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = '请填写完整'; return; }
  if (!document.getElementById('loginAgree').checked) {
    errEl.textContent = '请先同意隐私政策'; return;
  }
  try {
    const r = await api('/token/login.php', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    S.token = r.token;
    S.user = { id: r.user_id, username: r.username, role: r.role };
    localStorage.setItem('lc_token', r.token);
    localStorage.setItem('lc_username', r.username);
    localStorage.setItem('lc_email', u);
    await initApp();
    showPage('chat');
    startPolling('list');
  } catch (e) { errEl.textContent = e.message; }
}

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const em = document.getElementById('regEmail').value.trim();
  const errEl = document.getElementById('regError');
  errEl.textContent = '';
  if (!u || !p || !em) { errEl.textContent = '请填写所有必填项'; return; }
  if (p.length < 6) { errEl.textContent = '密码至少6位'; return; }
  if (!document.getElementById('regAgree').checked) {
    errEl.textContent = '请先同意隐私政策'; return;
  }
  try {
    const r = await api('/token/register.php', { method: 'POST', body: JSON.stringify({ username: u, password: p, email: em }) });
    S.token = r.token;
    S.user = { id: r.user_id, username: r.username, role: 'member' };
    localStorage.setItem('lc_token', r.token);
    localStorage.setItem('lc_username', r.username);
    await initApp();
    showPage('chat');
    startPolling('list');
  } catch (e) { errEl.textContent = e.message; }
}

function doLogout() {

}

// 清除登录态（登出 / 401 过期共用）
function clearAuth() {

// ── 初始化 ──
async function initApp() {
  try {
    // 频道列表
    const chData = await api('/channels/list.php');
    S.channels = chData.channels || [];
    S.joinedIds = new Set();
    S.channels.forEach(ch => { if (ch.is_joined) S.joinedIds.add(ch.id); });

    // 私聊列表
    try {
      const pvData = await api('/private/list.php');
      S.privateChats = pvData.chats || [];
    } catch (e) { S.privateChats = []; }

    renderChatList();
    S.unreadSnap = takeUnreadSnapshot(); // 刷新后静默基线，不误震
  } catch (e) { console.error('initApp error', e); }
}

// ── 渲染聊天列表（三段可折叠，频道含未读数）──
function getCollapsed() {
  try { return JSON.parse(localStorage.getItem('watch_collapsed') || '{}') || {}; }
  catch (e) { return {}; }
}
function setCollapsed(key, v) {
  const c = getCollapsed(); c[key] = v;
  localStorage.setItem('watch_collapsed', JSON.stringify(c));
}
function toggleSection(key) {
  const c = getCollapsed();
  const v = !c[key]; setCollapsed(key, v);
  const title = document.querySelector('[data-sec="' + key + '"]');
  const body = document.querySelector('[data-secbody="' + key + '"]');
  if (title) title.classList.toggle('collapsed', v);
  if (body) body.classList.toggle('collapsed', v);
}
const SECTION_DEFAULTS = { channels: false, private: false }; // 频道/私聊默认展开（"所有用户"区已移除，见 renderChatList）
function sectionHTML(key, label, bodyHtml) {
  const c = getCollapsed();
  const v = c[key] === undefined ? (SECTION_DEFAULTS[key] || false) : c[key];
  const collapsed = v === true;
  return '<div class="section-title' + (collapsed ? ' collapsed' : '') + '" data-sec="' + key + '" onclick="toggleSection(\'' + key + '\')"><span class="arrow">▼</span>' + esc(label) + '</div>' +
    '<div class="section-body' + (collapsed ? ' collapsed' : '') + '" data-secbody="' + key + '">' + bodyHtml + '</div>';
}
function renderChatList() {
  const list = document.getElementById('chat_list');
  let html = '';

  // 频道（只显示已加入；未加入的公开/私密频道统一走顶部"添加好友/群组"发现，
  // 未加入私密对非成员完全不可见，与桌面端一致）
  const joinedChans = S.channels.filter(ch => S.joinedIds.has(ch.id));
  if (joinedChans.length > 0) {
    let inner = '';
    for (const ch of joinedChans) {
      const icon = ch.type === 'announcement' ? '📢' : '#';
      const unread = ch.unread_count || 0;
      const badge = unread > 0
        ? '<div class="read-pre unread">' + (unread > 99 ? '99+' : unread) + '</div>'
        : '<div class="read-pre read">' + ch.member_count + '人</div>';
      inner += '<div class="userlist" onclick="openChannel(' + ch.id + ')">' +
        '<div class="head" style="background:' + avatarColor(ch.display_name) + '">' + icon + '</div>' +
        '<div class="user-pre"><div class="name">' + esc(ch.display_name) + '</div>' +
        '<div class="message-pre">' + (unread > 0 ? '<span style="color:#ff453a;font-weight:600">' + unread + ' 条新消息</span>' : '已加入') + '</div></div>' +
        badge + '</div>';
    }
    html += sectionHTML('channels', '频道', inner);
  }

  // 私聊（未读红胶囊 / 无未读显示时间）
  if (S.privateChats.length > 0) {
    let inner = '';
    for (const pc of S.privateChats) {
      const unread = pc.unread_count || 0;
      const dn = pc.other_display_name || pc.other_username;
      const lastTxt = pc.last_message || (unread === 0 && pc.last_message_at ? '' : '');
      inner += '<div class="userlist" onclick="openPrivate(' + pc.id + ',' + pc.other_user_id + ',\'' + js(dn) + '\')">' +
        '<div class="head" style="background:' + avatarColor(dn) + '">' + avatarHTML(pc.other_user_id, dn) + '</div>' +
        '<div class="user-pre"><div class="name">' + esc(dn) + (pc.dnd ? ' <span style="font-size:12px">🔕</span>' : '') + '</div>' +
        '<div class="message-pre">' + (lastTxt ? esc(lastTxt) : (unread === 0 ? '暂无消息' : '')) + '</div></div>' +
        (unread > 0 ? '<div class="read-pre unread">' + (unread > 99 ? '99+' : unread) + '</div>' : '<div class="read-pre read">' + fmtListTime(pc.last_message_at) + '</div>') +
        '</div>';
    }
    html += sectionHTML('private', '私聊', inner);
  }

  if (!html) html = '<div style="padding:24px;text-align:center;color:var(--txt2);font-size:15px">还没有会话，点上方 ➕ 搜索频道或用户</div>';
  list.innerHTML = html;
}

async function discoverSearch(q) {
  const box = document.getElementById('discoverResults');
  if (!box) return;
  const kw = q.toLowerCase();
  // 群组：已加入的全部 + 公开频道（未加入私密不参与搜索）
  const chans = S.channels.filter(ch =>
    (S.joinedIds.has(ch.id) || ch.type === 'public') &&
    ((ch.display_name || '').toLowerCase().indexOf(kw) !== -1 || (ch.name || '').toLowerCase().indexOf(kw) !== -1)
  );
  try {
    const data = await api('/users/search.php?q=' + encodeURIComponent(q));
    const users = (data.users || []).filter(u => u.id !== S.user.id);
    let html = '';
    if (chans.length) {
      html += '<div class="seg-label">群组 (' + chans.length + ')</div>';
      html += chans.map(ch => {
        const joined = S.joinedIds.has(ch.id);
        const meta = (ch.type === 'private' ? '🔒 私密' : ch.type === 'announcement' ? '📢 公告' : '# 公开') + ' · ' + ch.member_count + ' 人';
        return '<div class="userlist" onclick="openChannel(' + ch.id + ')">' +
          '<div class="head" style="background:' + avatarColor(ch.display_name) + '">' + (ch.type === 'private' ? '🔒' : ch.type === 'announcement' ? '📢' : '#') + '</div>' +
          '<div class="user-pre"><div class="name">' + esc(ch.display_name) + '</div>' +
          '<div class="message-pre">' + meta + ' · ' + (joined ? '已加入' : '未加入') + '</div></div>' +
          (joined
            ? (ch.unread_count > 0 ? '<div class="read-pre unread">' + Math.min(ch.unread_count, 99) + '</div>' : '<div class="read-pre read">' + ch.member_count + '人</div>')
            : '<div class="read-pre read join">+</div>') +
          '</div>';
      }).join('');
    }
    if (users.length) {
      html += '<div class="seg-label">用户 (' + users.length + ')</div>';
      html += users.map(u =>
        '<div class="userlist" onclick="startPrivate(' + u.id + ',\'' + js(u.username) + '\')">' +
        '<div class="head" style="background:' + avatarColor(u.nickname || u.username) + '">' + avatarHTML(u.id, u.username) + '</div>' +
        '<div class="user-pre"><div class="name">' + esc(u.nickname || u.username) + '</div>' +
        '<div class="message-pre">' + esc(u.role || '') + '</div></div>' +
        '<div class="read-pre read join">→</div></div>'
      ).join('');
    }
    box.innerHTML = html || '<div style="padding:12px 2px;font-size:13px;color:var(--txt2)">未找到匹配的群组或用户</div>';
  } catch (e) {
    box.innerHTML = '<div style="padding:12px 2px;font-size:13px;color:#f44">搜索失败，请稍后再试</div>';
  }
}

function avatarHTML(uid, name) {

}
// ── 打开对话 ──
function syncChatMgBtn() {
  const mg = document.getElementById('mgBtn');
  if (!mg || !S.activeChat) { if (mg) mg.style.display = 'none'; return; }
  let show = false;
  if (S.activeChat.type === 'private') {
    show = true;
  } else if (S.activeChat.joined) {
    const ch = S.channels.find(c => c.id === S.activeChat.id);
    show = ch ? !(ch.type === 'announcement' || (ch.name && ['general', 'announcements', 'help'].indexOf(ch.name) !== -1)) : false;
  }

async function openChannel(id) {
  const ch = S.channels.find(c => c.id === id);
  if (!ch) return;
  S.activeChat = { id, type: 'channel', name: ch.display_name, joined: S.joinedIds.has(id) };
  if (ch.unread_count) { ch.unread_count = 0; }
  document.getElementById('chatboxTitle').textContent = '# ' + ch.display_name;
  // 服务端标记已读（fire-and-forget，桌面同款语义）
  if (S.activeChat.joined) {
    api('/channels/read.php', { method: 'POST', body: JSON.stringify({ channel_id: id }) }).catch(() => {});
  }
  showPage('chatbox');
  syncChatMgBtn();
  await loadHistory();
}

async function openPrivate(chatId, otherUserId, otherName) {
  S.activeChat = { id: chatId, type: 'private', name: otherName, otherUserId };
  const pc = S.privateChats.find(c => c.id === chatId);
  if (pc) pc.unread_count = 0;
  document.getElementById('chatboxTitle').textContent = otherName;
  showPage('chatbox');
  syncChatMgBtn();
  await loadHistory();
}

async function startPrivate(uid, name) {
  // 仅创建会话，不自动发消息
  try {
    const r = await api('/private/create.php', { method: 'POST', body: JSON.stringify({ to_user_id: uid }) });
    await openPrivate(r.chat_id, uid, name);
  } catch (e) { toast('发起会话失败: ' + e.message, true); }
}
// ── 加载历史消息 ──
async function loadHistory() {
  if (!S.activeChat) return;
  const box = document.getElementById('box');
  box.innerHTML = '';
  S.messages = [];
  S.lastMsgTime = 0;

  try {
    let msgs;
    if (S.activeChat.type === 'channel') {
      const r = await api('/messages/history.php?channel_id=' + S.activeChat.id + '&limit=100');
      msgs = r.messages || [];
    } else {
      const r = await api('/private/history.php?chat_id=' + S.activeChat.id + '&limit=100');
      msgs = r.messages || [];
    }

    S.messages = msgs;
    if (msgs.length > 0) S.lastPollId = msgs[msgs.length - 1].id;
    renderMessages();
    startPolling('chatbox');
  } catch (e) { console.error('loadHistory', e); }
}

// ── 渲染消息 ──
function isSelfMsg(m, uid) { return m.user_id === uid || m.from_user_id === uid; }
function senderKeyOf(m) { return m.user_id || m.from_user_id || 0; }
// 页面滚动容器是 window（#box 无固定高度不产生滚动条）
function isNearBottom() {
  const doc = document.documentElement;
  return window.innerHeight + window.scrollY >= doc.scrollHeight - 70;
}
function scrollBottom() {
  window.scrollTo(0, document.body.scrollHeight);
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 150); // 图片等异步内容加载后兜底
}

// 单条消息 HTML（内部维护 S.lastMsgTime / S.lastMsgUserId 做时间分隔与连续分组）
function buildMessageHTML(m, uid) {
  if (m.type === 'system') { S.lastMsgUserId = 0; return '<div class="system-message-text">' + esc(m.content) + '</div>'; }
  const self = isSelfMsg(m, uid);
  const ts = parseTime(m.created_at);
  let html = '';
  if (ts && S.lastMsgTime > 0 && (ts - S.lastMsgTime) > 180000) {
    html += '<div class="time-sep">' + formatTimestamp(ts) + '</div>';
  }
  if (ts) S.lastMsgTime = ts;
  const key = senderKeyOf(m);
  // 私聊顶部标题已显示对方名字，消息上方不再重复显示 sender；频道仍需区分发言者
  const isPrivate = S.activeChat && S.activeChat.type === 'private';
  const showName = !isPrivate && !self && key !== S.lastMsgUserId;
  S.lastMsgUserId = key;
  if (showName) {
    html += '<div class="message-sender-name">' + esc(m.username || ('用户' + key)) + '</div>';
  }
  html += '<div class="message-text' + (self ? ' selfmessage' : '') + '">' +
    esc(m.content || '') +
    (m.file_url ? renderFileAttachment(m) : '') +
    '</div>';
  return html;
}

function renderMessages() {
  const box = document.getElementById('box');
  const inputBar = document.getElementById('inputBar');
  if (!S.activeChat) return;

  const joinBtn = document.getElementById('joinBtn');
  const isUnjoinedChannel = S.activeChat.type === 'channel' && !S.activeChat.joined;
  if (isUnjoinedChannel) {
    inputBar.style.display = 'none';
    joinBtn.style.display = '';
  } else {
    inputBar.style.display = 'flex';
    joinBtn.style.display = 'none';
  }

  const uid = S.user ? S.user.id : 0;
  S.lastMsgTime = 0;
  S.lastMsgUserId = 0;
  const parts = [];
  for (const m of S.messages) parts.push(buildMessageHTML(m, uid));
  box.innerHTML = parts.join('');
  if (S.messages.length === 0) {
    box.innerHTML = '<div class="system-message-text" style="margin-top:30px">暂无消息，说点什么吧 👋</div>';
  }
  scrollBottom();
  // #box 内图片异步加载后若仍在底部则跟随滚底（capture 捕获 load）
  if (!box._imgLoadBound) {
    box._imgLoadBound = true;
    box.addEventListener('load', e => {
      if (e.target && e.target.tagName === 'IMG' && isNearBottom()) scrollBottom();
    }, true);
  }
}

// 增量追加（轮询新消息 / 本地发送），上翻阅读时不打扰
function appendMessages(msgs) {
  const box = document.getElementById('box');
  if (!box || !msgs || msgs.length === 0) return;
  const uid = S.user ? S.user.id : 0;
  const stickBottom = isNearBottom();
  let anySelf = false;
  const parts = [];
  for (const m of msgs) {
    parts.push(buildMessageHTML(m, uid));
    if (isSelfMsg(m, uid)) anySelf = true;
  }
  box.insertAdjacentHTML('beforeend', parts.join(''));
  if (stickBottom || anySelf) scrollBottom();
}

function renderFileAttachment(m) {
  const fullUrl = safeFileUrl(m.file_url || '');
  // 图片判定：消息类型为 image（与桌面端一致）或 URL 带常见图片扩展名
  const looksImage = m.type === 'image' || m.file_type === 'image' || /\.(jpg|jpeg|png|gif|webp|bmp|avif)$/i.test(m.file_url || '');
  if (looksImage) {
    return '<br><img src="' + esc(fullUrl) + '" alt="" class="msg-img" onclick="showImg(\'' + js(fullUrl) + '\')">';
  }
  return '<br><a href="' + esc(fullUrl) + '" target="_blank" rel="noopener noreferrer">📎 ' + (m.file_size ? formatSize(m.file_size) : '文件') + '</a>';
}
// ── 发送消息（本地立即上屏，不整页重载）──
async function sendMsg() {
  if (!S.activeChat || S.sending) return;
  const input = document.getElementById('msg');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;
  S.sending = true;
  if (btn) btn.disabled = true;
  input.value = '';
  try {
    let r;
    if (S.activeChat.type === 'channel') {
      r = await api('/messages/send.php', { method: 'POST', body: JSON.stringify({ channel_id: S.activeChat.id, content: text }) });
    } else {
      r = await api('/private/send.php', { method: 'POST', body: JSON.stringify({ to_user_id: S.activeChat.otherUserId, content: text }) });
      if (r.chat_id) S.activeChat.id = r.chat_id;
    }
    const m = { id: r.message_id || (Date.now() % 100000000), content: text, username: S.user.username, type: 'text', created_at: nowString() };
    if (S.activeChat.type === 'channel') m.user_id = S.user.id; else m.from_user_id = S.user.id;
    S.messages.push(m);
    S.lastPollId = Math.max(S.lastPollId, m.id);
    appendMessages([m]);
  } catch (e) {
    input.value = text; // 失败恢复输入
    toast('发送失败: ' + e.message, true);
  } finally {
    S.sending = false;
    if (btn) btn.disabled = false;
    try { input.focus(); } catch (e) {}
  }
}

// ── 会话管理（⚙️：频道管理 / 联系人管理）──
function openManage() { document.getElementById('manageSheet').classList.add('open'); }
function closeManage() { document.getElementById('manageSheet').classList.remove('open'); }

/* ═══════ 频道管理（身份识别：owner 可编辑，member 名称锁死）═══════ */

    html += '<label>频道权限</label><select id="mgType">' +

      '<option value="private"' + (ch.type === 'private' ? ' selected' : '') + '>私密 — 仅成员可见，需邀请</option></select>' +
      '<label>描述</label><input type="text" id="mgDesc" maxlength="200" placeholder="频道简介（可选）" value="' + esc(ch.description || '') + '">' +
      '<button class="mg-btn" onclick="saveChannelManage()">💾 保存设置</button>';
  }
  if (isPrivate) {
    html += '<label>邀请成员（输入对方用户名）</label><div class="rowline" style="border:none;padding:0">' +
      '<input type="text" id="mgInviteUser" placeholder="用户名" style="flex:1"><button class="mg-btn ghost" style="width:auto;margin:0;padding:9px 16px" onclick="inviteChannelMember()">邀请</button></div>';
  }
  panel.innerHTML = html;
  // 成员名单（异步加载）
  html += '<div style="margin-top:14px"><div style="font-size:13px;color:var(--txt2);margin-bottom:6px">成员名单</div><div id="mgMembers" style="border-top:1px solid var(--sep)">加载中…</div></div>';
  panel.innerHTML = html;
  // 底部动作：owner=解散 / member=退出（退出统一放在管理里）
  html = panel.innerHTML + (isOwner
    ? '<button class="mg-btn danger" onclick="deleteChannelManage()">🗑️ 解散频道</button>'
    : '<button class="mg-btn danger" onclick="leaveChannelManage()">🚪 退出频道</button>');
  panel.innerHTML = html;
  // 拉成员
  try {
    const res = await api('/channels/members.php?channel_id=' + id);
    const members = res.members || [];
    const me = S.user ? S.user.id : 0;
    document.getElementById('mgMembers').innerHTML = members.map(mb => {
      const nm = mb.nickname || mb.username;

// ── 轮询（双模式：list 未读汇总+震动 / chatbox 长轮询增量渲染）──
function startPolling(mode) {
  if (mode) S.pollMode = mode;
  stopPolling();
  poll();
}
function stopPolling() {
  if (S.pollTimer) { clearTimeout(S.pollTimer); S.pollTimer = null; }
  if (S.pollAbort) { try { S.pollAbort.abort(); } catch (e) {} S.pollAbort = null; }
}
function schedulePoll() { S.pollTimer = setTimeout(poll, S.pollInterval); }

function takeUnreadSnapshot() {
  const snap = {};
  (S.channels || []).forEach(ch => { if (S.joinedIds.has(ch.id)) snap['c' + ch.id] = ch.unread_count || 0; });
  (S.privateChats || []).forEach(pc => { snap['p' + pc.id] = pc.unread_count || 0; });
  return snap;
}

async function poll() {
  if (!S.token || !S.user) return;
  if (document.hidden) { schedulePoll(); return; } // 后台/熄屏：空转不请求
  try {
    if (S.pollMode === 'chatbox') await pollChatbox();
    else await pollList();
  } finally {
    if (S.pollMode) schedulePoll();
  }
}

async function pollChatbox() {
  if (!S.activeChat) { S.pollMode = 'list'; return; }
  const ac = new AbortController();
  S.pollAbort = ac;
  const t = setTimeout(() => ac.abort(), 13000); // 服务端长轮询 10s，超时余量
  try {
    let url;
    if (S.activeChat.type === 'channel') {
      url = API_BASE + '/api/messages/poll.php?channels=' + S.activeChat.id + '&since_id=' + S.lastPollId + '&timeout=10';
    } else {
      url = API_BASE + '/api/messages/poll.php?private_chat_id=' + S.activeChat.id + '&since_id=' + S.lastPollId + '&timeout=10';
    }
    const headers = { 'Authorization': 'Bearer ' + S.token };
    const res = await fetch(url, { headers, signal: ac.signal });
    clearTimeout(t);
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      const existingIds = new Set(S.messages.map(m => m.id));
      const fresh = [];
      for (const m of data.messages) {
        if (!existingIds.has(m.id)) { S.messages.push(m); existingIds.add(m.id); fresh.push(m); }
      }
      if (fresh.length > 0) {
        appendMessages(fresh); // 增量上屏，正在翻历史时不打扰
        S.lastPollId = Math.max(data.latest_id || 0, fresh[fresh.length - 1].id || 0, S.lastPollId);
        // 频道：正停留在底部阅读 → 同步已读位置，回列表不残留红点
        if (S.activeChat && S.activeChat.type === 'channel' && isNearBottom()) {
          api('/channels/read.php', { method: 'POST', body: JSON.stringify({ channel_id: S.activeChat.id }) }).catch(() => {});
        }
      }
    }
  } catch (e) {
    if (e && e.status === 401) handleAuthExpired();
    /* 其余 abort/网络错误：静默 */
  }
  finally { S.pollAbort = null; }
}

// 列表页：轻量汇总轮询，未读增长 → 震动提醒
async function pollList() {
  try {
    const [chData, pvData] = await Promise.all([
      api('/channels/list.php'),
      api('/private/list.php').catch(() => ({ chats: S.privateChats || [] }))
    ]);
    const nextCh = chData.channels || [];
    const nextPv = pvData.chats || [];
    const prev = S.unreadSnap;
    const next = {};
    let growth = false;       // 任意会话未读增长 → 需要重绘列表/红点
    let vibrateWorthy = false; // 增长来自非免打扰会话 → 才震动提醒
    nextCh.forEach(ch => { if (ch.is_joined) { const n = ch.unread_count || 0; next['c' + ch.id] = n; if ((prev['c' + ch.id] || 0) < n) { growth = true; vibrateWorthy = true; } } });
    nextPv.forEach(pc => { const n = pc.unread_count || 0; next['p' + pc.id] = n; if ((prev['p' + pc.id] || 0) < n) { growth = true; if (!pc.dnd) vibrateWorthy = true; } });
    S.channels = nextCh;
    S.privateChats = nextPv;
    S.joinedIds = new Set(nextCh.filter(c => c.is_joined).map(c => c.id));
    const changed = JSON.stringify(prev) !== JSON.stringify(next);
    if (changed) {
      const winTop = window.scrollY;
      renderChatList();
      window.scrollTo(0, winTop);
      if (vibrateWorthy) vibrate();
    }
    S.unreadSnap = next;
  } catch (e) {
    if (e && e.status === 401) handleAuthExpired();
    /* 其余网络错误：静默 */
  }
}

// ── 工具函数 ──
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// JS 单引号字符串安全转义（用于 inline onclick 拼参，防用户名含 ' 破坏/注入）
function js(s) {
  if (s === undefined || s === null) return '';
  return String(s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, '\\u0027')
    .replace(/"/g, '\\u0022')
    .replace(/</g, '\\u003C')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '')
    .replace(/&/g, '\\u0026');
}

// 页面内轻提示（替代 alert）
let _toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// 头像 hash 色板（watchOS 渐变感 → 扁平亮色）
const AVATAR_COLORS = ['#0a84ff','#30d158','#ff9f0a','#ff453a','#bf5af2','#64d2ff','#ffd60a','#ff375f','#5e5ce6','#66d4cf'];
function avatarColor(str) {
  let h = 0;
  const t = String(str || '?');
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function nowString() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function fmtListTime(ts) {
  if (!ts) return '';
  const t = parseTime(ts);
  if (!t) return '';
  const d = new Date(t), td = new Date();
  const p = n => String(n).padStart(2, '0');
  const sameDay = d.getFullYear() === td.getFullYear() && d.getMonth() === td.getMonth() && d.getDate() === td.getDate();
  if (sameDay) return p(d.getHours()) + ':' + p(d.getMinutes());
  const yesterday = new Date(Date.now() - 86400000);
  if (d.getFullYear() === yesterday.getFullYear() && d.getMonth() === yesterday.getMonth() && d.getDate() === yesterday.getDate()) return '昨天';
  if (d.getFullYear() === td.getFullYear()) return (d.getMonth() + 1) + '/' + d.getDate();
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
function vibrate() {
  try { if (navigator.vibrate) navigator.vibrate([0, 90, 50, 120]); } catch (e) { /* 不支持则忽略 */ }
}
function safeFileUrl(u) {
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^javascript:|^data:|^vbscript:/i.test(u)) return '';
  return API_BASE + u;
}
function formatSize(b) { if (!b) return '0B'; const u = ['B','KB','MB','GB']; let i=0, s=b; while(s>=1024&&i<3){s/=1024;i++;} return s.toFixed(1)+' '+u[i]; }
function showImg(url) { document.getElementById('imgViewerImg').src = url; document.getElementById('imgViewer').style.display = 'block'; }
function hideImg() { document.getElementById('imgViewer').style.display = 'none'; }

function parseTime(t) {
  if (!t) return 0;
  // "2026-05-28 08:00:00" → timestamp
  const ms = Date.parse(t.replace(' ', 'T') + '+08:00');
  return isNaN(ms) ? 0 : ms;
}

function formatTimestamp(ts) {
  const now = Date.now();
  const d = new Date(ts);
  const td = new Date();
  const isToday = d.getFullYear() === td.getFullYear() && d.getMonth() === td.getMonth() && d.getDate() === td.getDate();
  const yesterday = new Date(now - 86400000);
  const isYesterday = d.getFullYear() === yesterday.getFullYear() && d.getMonth() === yesterday.getMonth() && d.getDate() === yesterday.getDate();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0'), time = hh+':'+mm;
  if (isToday) return '今天 ' + time;
  if (isYesterday) return '昨天 ' + time;
  if (d.getFullYear() === td.getFullYear()) return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+time;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+time;
}
